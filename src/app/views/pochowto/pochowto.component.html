<section class="page-header">
  <div>
    <h1>POC How-To</h1>
    <p>Guides and walkthroughs for Group PoC</p>
  </div>
</section>

<div class="segmented-tabs pochowto-tabs" role="tablist" aria-label="POC how-to sections">
  @for (tab of tabs; track tab.id) {
    <button
      type="button"
      role="tab"
      [class.active]="activeTab === tab.id"
      [attr.aria-selected]="activeTab === tab.id"
      (click)="selectTab(tab.id)">
      <i class="bi {{ tab.icon }}"></i>
      {{ tab.label }}
    </button>
  }
</div>

@for (tab of tabs; track tab.id) {
  @if (activeTab === tab.id) {
    <div class="panel pochowto-panel" role="tabpanel">
      <h2>{{ tab.label }}</h2>
      <p class="pochowto-panel-desc">{{ tab.description }}</p>
      <quill-editor
        class="pochowto-editor"
        [class.pochowto-toolbar-hidden]="!editing[tab.id]"
        [(ngModel)]="draftContent[tab.id]"
        [readOnly]="!editing[tab.id]"
        [placeholder]="'Write notes for ' + tab.label + '…'">
      </quill-editor>
      <div class="pochowto-actions">
        @if (editing[tab.id]) {
          <button class="btn btn-outline-secondary" type="button" (click)="cancelEdit(tab.id)">Cancel</button>
          <button class="btn btn-primary" type="button" (click)="saveEdit(tab.id)">Save</button>
        } @else {
          <button class="btn btn-outline-secondary" type="button" (click)="startEdit(tab.id)">
            <i class="bi bi-pencil"></i>
            Edit
          </button>
        }
      </div>
    </div>
  }
}
